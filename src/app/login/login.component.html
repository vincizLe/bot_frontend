<div class="login-container">
    <mat-card class="login-card">
        <h2>Login</h2>
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Username</mat-label>
                <input matInput class="input-box"type="text" [(ngModel)]="username" name="username" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput class="input-box" type="password" [(ngModel)]="password" name="password" required>
            </mat-form-field>

            <div *ngIf="errorMessage" class="error-message">{{errorMessage}}</div>

            <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="!loginForm.valid">Login</button>
        </form>
    </mat-card>
</div>
