<div class="metrics-container">
  <div class="form-container">
    <div class="filter-container">
      <mat-form-field>
        <mat-label>Start Date</mat-label>
        <input matInput [matDatepicker]="startDatePicker" (dateChange)="onStartDateChange($event)" [value]="startDate">
        <mat-datepicker-toggle matSuffix [for]="startDatePicker" ></mat-datepicker-toggle>
        <mat-datepicker #startDatePicker></mat-datepicker>
        
      </mat-form-field>
    
      <mat-form-field>
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="endDatePicker" (dateChange)="onEndDateChange($event)" [value]="endDate">
        <mat-datepicker-toggle matSuffix [for]="endDatePicker" ></mat-datepicker-toggle>
        <mat-datepicker #endDatePicker></mat-datepicker>
      </mat-form-field>
    
      <mat-form-field>
        <mat-label>User</mat-label>
        <mat-select [(value)]="selectedUser">
          <mat-option *ngFor="let user of users" [value]="user">{{ user }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    
    <table mat-table [dataSource]="filteredData()" class="mat-elevation-z8 --mat-sys-surface" >
      <ng-container matColumnDef="question">
        <th mat-header-cell *matHeaderCellDef>Question</th>
        <td mat-cell *matCellDef="let element">{{ element.question }}</td>
      </ng-container>
    
      <ng-container matColumnDef="response">
        <th mat-header-cell *matHeaderCellDef>Response</th>
        <td mat-cell *matCellDef="let element">{{ element.response }}</td>
      </ng-container>
    
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let element">{{ element.user }}</td>
      </ng-container>
    
      <ng-container matColumnDef="token">
        <th mat-header-cell *matHeaderCellDef>Token</th>
        <td mat-cell *matCellDef="let element">{{ element.token }}</td>
      </ng-container>
    
      <ng-container matColumnDef="datetime">
        <th mat-header-cell *matHeaderCellDef>Datetime</th>
        <td mat-cell *matCellDef="let element">{{ element.datetime | date: 'short' }}</td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
