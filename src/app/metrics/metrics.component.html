<div class="metrics-container">
    <mat-card
      *ngFor="let metric of metrics"
      class="metric-card"
      (click)="navigateTo(metric.route)"
    >
      <img mat-card-image [src]="metric.image" [alt]="metric.title" />
      <mat-card-content>
        <h2 class="metric-title">{{ metric.title }}</h2>
        <p class="metric-description">{{ metric.description }}</p>
      </mat-card-content>
    </mat-card>
  </div>
